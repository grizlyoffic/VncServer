<!DOCTYPE html>
<html>
<head>
  <title>Enter Bot Token</title>
</head>
<body>
  <h2>Enter your Bot Token</h2>
  <form action="/token" method="post">

    <button type="submit" name="action" value="next">Next</button>
    <button type="submit" name="action" value="skip">Skip</button>
  </form>
</body>
</html>
